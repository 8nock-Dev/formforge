version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: formforge_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       formforge
      POSTGRES_USER:     formforge
      POSTGRES_PASSWORD: formforge_secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: formforge_backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV:     production
      PORT:         3002
      DATABASE_URL: postgresql://formforge:formforge_secret@db:5432/formforge
      JWT_SECRET:   change_this_to_a_long_random_secret_before_deploying
      FRONTEND_URL: http://localhost:5174
      APP_URL:      http://localhost:5174
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
